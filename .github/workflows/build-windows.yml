# Build FourPointProbe.exe cho Windows trên GitHub Actions.
#  - Chỉ chạy khi bạn bấm: tab Actions -> "Build Windows" -> "Run workflow" (commit/push KHÔNG tự chạy).
#    File exe nằm ở mục "Artifacts" của lượt chạy.
#  - Muốn tạo Release luôn: điền ô "Tên tag" (vd v1.0.1) khi bấm Run workflow.
#  - Hoặc gắn tag dạng v1.0.0 và đẩy lên: cũng tạo Release có file zip.

name: Build Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tên tag để tạo Release (vd v1.0.1). Để trống nếu chỉ muốn build."
        required: false
        default: ""

permissions:
  contents: write   # cần để tạo Release khi đẩy tag

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài Rust (stable, MSVC)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache thư viện Rust
        uses: Swatinem/rust-cache@v2

      - name: Kiểm thử
        run: cargo test --locked

      - name: Build bản release
        run: cargo build --release --locked

      - name: Đóng gói
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/FourPointProbe.exe dist/
          Copy-Item README.md dist/
          Compress-Archive -Path dist/* -DestinationPath FourPointProbe-windows-x64.zip -Force

      - name: Tải lên Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FourPointProbe-windows-x64
          path: dist/
          retention-days: 90

      - name: Tạo Release (khi đẩy tag v* hoặc điền tên tag)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: FourPointProbe-windows-x64.zip
          generate_release_notes: true
