# Build FourPointProbe.exe cho Windows trên GitHub Actions.
#  - Mỗi lần push / pull request: chạy kiểm thử + build, tải file exe ở mục "Artifacts" của lượt chạy.
#  - Chạy tay: tab Actions -> "Build Windows" -> "Run workflow".
#  - Gắn tag dạng v1.0.0 (git tag v1.0.0 && git push --tags): tạo thêm một Release có file zip.

name: Build Windows

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # cần để tạo Release khi đẩy tag

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài Rust (stable, MSVC)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache thư viện Rust
        uses: Swatinem/rust-cache@v2

      - name: Kiểm thử
        run: cargo test --locked

      - name: Build bản release
        run: cargo build --release --locked

      - name: Đóng gói
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/FourPointProbe.exe dist/
          Copy-Item README.md dist/
          Compress-Archive -Path dist/* -DestinationPath FourPointProbe-windows-x64.zip -Force

      - name: Tải lên Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FourPointProbe-windows-x64
          path: dist/
          retention-days: 90

      - name: Tạo Release (chỉ khi đẩy tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: FourPointProbe-windows-x64.zip
          generate_release_notes: true
